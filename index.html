<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Fija tema e idioma antes del primer paint para evitar un flash del tema
      // incorrecto. Debe mantenerse en sincronía con useTheme y useLanguage.
      ;(function () {
        var theme = null
        var lang = null
        try {
          theme = localStorage.getItem('theme')
          lang = localStorage.getItem('lang')
        } catch (e) {
          /* localStorage no disponible: solo auto-detección */
        }
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme
        }
        if (lang !== 'en' && lang !== 'es') {
          lang = /^es(-|$)/i.test(navigator.language) ? 'es' : 'en'
        }
        document.documentElement.lang = lang
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO. Copy en inglés: es el idioma default del sitio y el que sirve al
         mercado objetivo (reclutadores internacionales vía LinkedIn); la
         auto-detección de idioma corre en cliente y los crawlers no la
         ejecutan, así que estas etiquetas estáticas son la única versión que
         ven los previsualizadores. -->
    <title>Edgar Ontiveros — Machine Learning Engineer / Developer</title>
    <meta
      name="description"
      content="Edgar Ontiveros, machine learning engineer and developer in Chihuahua, MX. I take systems from idea to production — the API, the data model, the interface, and the deploy."
    />
    <link rel="canonical" href="https://edgar-ontiveros.com/" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0e1a" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />

    <!-- Open Graph (og-image.png se regenera con scripts/generate_og_image.sh) -->

    <meta property="og:url" content="https://edgar-ontiveros.com/" />
    <meta property="og:site_name" content="Edgar Ontiveros" />
    <meta property="og:title" content="Edgar Ontiveros — Machine Learning Engineer / Developer" />
    <meta
      property="og:description"
      content="I take systems from idea to production — the API, the data model, the interface, and the deploy."
    />
    <meta property="og:image" content="https://edgar-ontiveros.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Edgar Ontiveros — Machine Learning Engineer / Developer, over a dark constellation-themed background"
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_MX" />

    <!-- Twitter Card -->

    <meta name="twitter:title" content="Edgar Ontiveros — Machine Learning Engineer / Developer" />

      name="twitter:description"
      content="I take systems from idea to production — the API, the data model, the interface, and the deploy."

    <meta name="twitter:image" content="https://edgar-ontiveros.com/og-image.png" />
    <meta
      name="twitter:image:alt"
